version: "4.0"

services:
  db_ta:
    image: mysql:8.0
    container_name: db_ta
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_ta
      MYSQL_USER: db_ta_user
      MYSQL_PASSWORD: db_ta_044$
    ports:
      - "3307:3306"
    volumes:
      - ./db_ta.sql:/docker-entrypoint-initdb.d/db_ta.sql
      - mysql_data:/var/lib/mysql

  backend_app:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: backend_app
    restart: always
    depends_on:
      - db_ta
    volumes:
      - ./back-end:/var/www/html
    ports:
      - "8080:8000"

  frontend_app:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: frontend_app
    depends_on:
      - backend_app
    volumes:
      - ./front-end:/app
    environment:
      VITE_BACK_END_URL: http://localhost:8080
      VITE_APP_VERSION: 1.0.0
    ports:
      - "5050:5173"
    restart: always

  notifier:
    image: curlimages/curl
    container_name: app_notifier
    depends_on:
      - frontend_app
    command: >
      sh -c "
        until curl -s http://backend_app:8000 > /dev/null; do sleep 2; done;
        until curl -s http://frontend_app:5173 > /dev/null; do sleep 2; done;
        echo '';
        echo '✅ App running successfully!';
        echo '🌐 Open http://localhost:5050 in your browser';
      "

volumes:
  mysql_data:
